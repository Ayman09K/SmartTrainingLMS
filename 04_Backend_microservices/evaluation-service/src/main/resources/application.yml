server:
  port: 8083
spring:
  application:
    name: evaluation-service
  datasource:
    url: jdbc:mysql://localhost:3306/smarttraining_evaluation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: smarttraining_user
    password: ${EVALUATION_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
info:
  app:
    name: evaluation-service
    description: Service quiz, questions, tentatives et scores SmartTraining AI
    version: 1.0.0

smarttraining:
  analytics-service:
    url: ${ANALYTICS_SERVICE_URL:http://localhost:8084}
