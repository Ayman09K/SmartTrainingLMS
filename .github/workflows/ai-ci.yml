name: AI CI

on:
  push:
    branches:
      - main
    paths:
      - "07_IA_FastAPI/**"
      - ".github/workflows/ai-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "07_IA_FastAPI/**"
      - ".github/workflows/ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: FastAPI / scikit-learn
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: 07_IA_FastAPI/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: 07_IA_FastAPI/ai-service
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile FastAPI sources
        working-directory: 07_IA_FastAPI/ai-service
        run: python -m compileall -q app

      - name: Validate risk model prediction
        working-directory: 07_IA_FastAPI
        run: python scripts/test_model_prediction.py